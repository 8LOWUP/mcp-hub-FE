<svg width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 원 -->
  <circle cx="17.5" cy="17.5" r="17" fill="url(#gradient1)" stroke="url(#gradient2)" stroke-width="1"/>
  
  <!-- 중앙 MCP 텍스트 -->
  <text x="17.5" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">MCP</text>
  
  <!-- 장식용 점들 -->
  <circle cx="8" cy="8" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="27" cy="8" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="8" cy="27" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="27" cy="27" r="1.5" fill="rgba(255,255,255,0.6)"/>
  
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8800ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8800ff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>
